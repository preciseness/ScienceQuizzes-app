<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>イオン道場</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: 1 column, 720px. Home = hero + set cards + review panel. Quiz = one question card with instant feedback. */
:root{
  --bg:#f3f6fa; --card:#ffffff; --ink:#12213a; --mute:#5a6a82; --line:#dfe6ef;
  --accent:#1f6fe0; --accent-ink:#ffffff; --accent-soft:#e4eefc;
  --ok:#14804a; --ok-soft:#e1f5ea; --ng:#c0392b; --ng-soft:#fdeaea;
  --pos:#e0294f; --pos-soft:#ffe1e7; --neg:#1f6fe0; --neg-soft:#dce9fd;
  --water:#d6e8fb; --gold:#f2c14e; --shadow:0 1px 2px rgba(18,33,58,.06),0 6px 20px rgba(18,33,58,.06);
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1626; --card:#16213a; --ink:#eaf0fb; --mute:#9db0cc; --line:#2a3858;
    --accent:#5b9bff; --accent-ink:#08152c; --accent-soft:#1b2f55;
    --ok:#56d18f; --ok-soft:#14352a; --ng:#ff8a7a; --ng-soft:#3d1d22;
    --pos:#ff7b94; --pos-soft:#4a1f2c; --neg:#6aa6ff; --neg-soft:#1b2f55;
    --water:#1d3558; --gold:#f2c14e; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1626; --card:#16213a; --ink:#eaf0fb; --mute:#9db0cc; --line:#2a3858;
  --accent:#5b9bff; --accent-ink:#08152c; --accent-soft:#1b2f55;
  --ok:#56d18f; --ok-soft:#14352a; --ng:#ff8a7a; --ng-soft:#3d1d22;
  --pos:#ff7b94; --pos-soft:#4a1f2c; --neg:#6aa6ff; --neg-soft:#1b2f55;
  --water:#1d3558; --gold:#f2c14e; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{line-height:1.35;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* hero */
.hero{padding:28px 4px 8px}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.hero h1{font-size:clamp(34px,8vw,48px);font-weight:900;letter-spacing:.02em;margin-top:6px}
.hero p.lead{color:var(--mute);margin-top:12px;max-width:34em}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 26px;font-weight:700;min-height:48px}
.cta:hover{filter:brightness(1.06)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{flex:1 1 140px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.stat b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:12.5px;color:var(--mute)}

.sec{margin-top:34px}
.sec>h2{font-size:19px;font-weight:700;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.set{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.set:hover{transform:translateY(-2px);border-color:var(--accent)}
.set .tag{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.set h3{font-size:18px;font-weight:700}
.set p{font-size:14px;color:var(--mute)}
.set .meta{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.set .meta b{color:var(--ink)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.panel.focus{border-color:var(--ng)}
.rv-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.rv-head .big{font-size:34px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}
.rv-head .big small{font-size:14px;font-weight:500;color:var(--mute);margin-left:4px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 18px;font-weight:700;min-height:46px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{background:var(--ng);color:#fff;border-color:var(--ng)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.weak{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.weak li{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center;font-size:14px}
.weak .nm{grid-column:1/-1;font-weight:500}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ng);border-radius:99px}
.weak .pc{font-variant-numeric:tabular-nums;color:var(--mute);text-align:right}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:8px;font-variant-numeric:tabular-nums}
.hist li:last-child{border:0;padding:0}
.hist span{color:var(--mute)}
.empty{color:var(--mute);font-size:14.5px}
.foot{margin-top:40px;font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:0;font-size:12.5px}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ghost{background:none;border:0;color:var(--mute);padding:8px 6px;font-weight:500;min-height:44px}
.qmeta{display:flex;gap:14px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--mute)}
.qmeta b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 16px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:var(--shadow)}
.unit{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.q{font-size:clamp(18px,4.6vw,21px);font-weight:700;margin:6px 0 18px;line-height:1.55}
.q:focus{outline:none}
.choices{display:grid;gap:10px}
.ch{display:flex;gap:12px;align-items:center;text-align:left;width: 100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:54px;transition:border-color .12s,background .12s}
.ch .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:13px}
.ch span:last-child{min-width:0;overflow-wrap:anywhere}
.ch:not([disabled]):hover{border-color:var(--accent);background:var(--accent-soft)}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.ok .k{background:var(--ok);color:#fff}
.ch.ng{border-color:var(--ng);background:var(--ng-soft)}
.ch.ng .k{background:var(--ng);color:#fff}
.ch[disabled]{cursor:default}
.ch[disabled]:not(.ok):not(.ng){opacity:.55}
.fb{margin-top:18px}
.verdict{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;animation:pop .25s ease-out}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.verdict .mk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px}
.verdict.ok .mk{background:var(--ok)}.verdict.ng .mk{background:var(--ng)}
.ans{margin-top:6px;font-size:15px}
.ans b{color:var(--ok)}
.exp{margin-top:10px;font-size:15px;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.figbox{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--bg)}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* figures */
svg.fig{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
svg.fig text{fill:var(--ink);font-size:12px;font-family:var(--font)}
svg.fig .sm{font-size:10.5px;fill:var(--mute)}
svg.fig .b{font-weight:700}
svg.fig .pos{fill:var(--pos)} svg.fig .neg{fill:var(--neg)} svg.fig .okc{fill:var(--ok)}
svg.fig .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.fig .wtr{fill:var(--water)}
svg.fig .box{fill:var(--card);stroke:var(--line);stroke-width:1.5}
svg.fig .bx2{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
svg.fig .i-p{fill:var(--pos-soft);stroke:var(--pos);stroke-width:1.4}
svg.fig .i-n{fill:var(--neg-soft);stroke:var(--neg);stroke-width:1.4}
svg.fig .i-0{fill:var(--card);stroke:var(--mute);stroke-width:1.4}
svg.fig .it{font-size:10px;font-weight:700}

/* result */
.res{text-align:center}
.ring{width:170px;height:170px;margin:6px auto 0;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset 1s ease-out}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.2}
.ring .num b{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
.ring .num small{font-size:13px;color:var(--mute)}
.res h2{font-size:22px;margin-top:14px}
.res .pc{color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.res .btns{justify-content:center;margin-top:18px}
.miss{margin-top:22px;text-align:left}
.miss h3{font-size:16px;margin-bottom:10px}
.mi{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--card)}
.mi summary{cursor:pointer;font-weight:500;font-size:15px}
.mi .a{margin-top:8px;font-size:14.5px}
.mi .a b{color:var(--ok)}
.note-u{margin:20px 0 8px;font-size:14px;color:var(--accent);font-weight:700}
@media (max-width:440px){.qcard{padding:18px 14px}.panel{padding:16px}}
</style>

<div class="wrap"><main id="app"></main></div>

<script>
/* ---------- データ(各問は 正解を先頭に書き、表示時にシャッフル) ---------- */
const UNITS={1:"水溶液と電流",2:"電離と電離式①",3:"電離と電離式②",4:"原子の構造",5:"陽イオンのでき方",6:"陰イオンのでき方",7:"イオンの表し方",8:"電気分解① 塩化銅",9:"電気分解② 塩酸",10:"電気分解の整理",11:"イオンへのなりやすさ",12:"電池のしくみ①",13:"電池のしくみ②",14:"いろいろな電池",15:"酸・アルカリの性質",16:"酸・アルカリの電離",17:"イオンの移動",18:"pH",19:"中和①",20:"中和② 塩",21:"中和と水溶液の変化",22:"総合演習①",23:"総合演習②",24:"単元テストと振り返り"};
const FIGKEY={1:'elec',2:'ionize',3:'ionize',4:'atom',5:'cation',6:'anion',7:'ionize',8:'cucl2',9:'hcl',10:'cucl2',11:'series',12:'daniell',13:'daniell',14:'battery',15:'litmus',16:'acidalk',17:'migrate',18:'ph',19:'neut',20:'neut',21:'neutchange',22:'cucl2',23:'daniell',24:'ionize'};
const FIGQ={'2-3':'i:HCl','3-1':'i:CuCl2','3-2':'i:NaOH','3-3':'i:H2SO4','5-3':'cation:Cu','7-1':'list:OH⁻','7-2':'list:SO₄²⁻','7-3':'list:NH₄⁺','8-3':'i:HCl:acid','9-3':'i:HCl','10-3':'hcl','15-3':'mg','16-3':'i:BaOH2','19-3':'litmus','20-3':'baso4','22-2':'cation','22-3':'elec','23-2':'ph:2','18-1':'ph:7','18-2':'ph:3,11','23-1':'daniell:mass','23-3':'neut','24-1':'elec','24-2':'daniell','24-3':'neut'};
const RAW=[
[1,"水に溶かすと水溶液に電流が流れる物質を何というか。","電解質",["非電解質","溶媒","指示薬"],"水に溶けて電流が流れる物質が電解質。塩化ナトリウムや塩化水素が例。"],
[1,"水に溶かしても電流が流れない物質を何というか。","非電解質",["電解質","金属","酸"],"砂糖やエタノールは水に溶けてもイオンに分かれないので、電流が流れない。"],
[1,"次のうち、電解質はどれか。","塩化ナトリウム",["砂糖","エタノール","ブドウ糖"],"塩化ナトリウムは水に溶けるとイオンに分かれる。砂糖・エタノール・ブドウ糖は非電解質。"],
[2,"電解質が水に溶けて、陽イオンと陰イオンに分かれることを何というか。","電離",["中和","電気分解","蒸発"],"電解質が水に溶けてイオンに分かれる現象を電離という。"],
[2,"塩化ナトリウムの電離を表す式はどれか。","NaCl → Na⁺ + Cl⁻",["NaCl → Na⁻ + Cl⁺","NaCl → Na + Cl","NaCl → Na²⁺ + Cl²⁻"],"ナトリウムは+1の陽イオン、塩素は−1の陰イオンになる。"],
[2,"塩化水素の電離を表す式はどれか。","HCl → H⁺ + Cl⁻",["HCl → H⁻ + Cl⁺","HCl → H₂ + Cl₂","HCl → H⁺ + 2Cl⁻"],"水素は陽イオン(H⁺)、塩素は陰イオン(Cl⁻)になる。塩化水素の水溶液が塩酸。"],
[3,"塩化銅(CuCl₂)の電離を表す式はどれか。","CuCl₂ → Cu²⁺ + 2Cl⁻",["CuCl₂ → Cu⁺ + 2Cl⁻","CuCl₂ → Cu²⁺ + Cl⁻","CuCl₂ → Cu²⁻ + 2Cl⁺"],"銅イオンは2+、塩化物イオンは1−。Clが2個あるので 2Cl⁻ になり、電気の合計は0になる。"],
[3,"水酸化ナトリウム(NaOH)の電離を表す式はどれか。","NaOH → Na⁺ + OH⁻",["NaOH → Na⁻ + OH⁺","NaOH → Na⁺ + O²⁻ + H⁺","NaOH → Na + OH"],"NaOH は Na⁺ と OH⁻(水酸化物イオン)に電離する。"],
[3,"硫酸(H₂SO₄)の電離を表す式はどれか。","H₂SO₄ → 2H⁺ + SO₄²⁻",["H₂SO₄ → H⁺ + SO₄⁻","H₂SO₄ → 2H⁻ + SO₄²⁺","H₂SO₄ → H₂ + SO₄"],"水素イオン2個(+2)と硫酸イオン(2−)で、電気がつり合う。"],
[4,"原子の中心にある、+の電気を持つ部分を何というか。","原子核",["電子","中性子","分子"],"原子の中心に原子核があり、そのまわりを−の電気を持つ電子が回っている。"],
[4,"原子核をつくっている粒子の組み合わせはどれか。","陽子と中性子",["陽子と電子","中性子と電子","電子だけ"],"原子核は+の電気を持つ陽子と、電気を持たない中性子でできている。"],
[4,"原子全体が電気を帯びていない理由はどれか。","陽子の数と電子の数が等しいから",["中性子が電気を打ち消すから","電子が原子核の中にあるから","電気を持つ粒子がないから"],"+の陽子と−の電子が同じ数なので、電気がつり合っている。"],
[5,"原子が電子を失うと、何イオンになるか。","陽イオン",["陰イオン","中性子","分子"],"電子(−)が減ると、+の電気のほうが多くなり、陽イオンになる。"],
[5,"ナトリウム原子が電子を1個失ってできるイオンはどれか。","Na⁺",["Na⁻","Na²⁺","Na"],"電子を1個失うと+が1つ多くなるので Na⁺ になる。"],
[5,"銅原子が電子を2個失ってできるイオンはどれか。","Cu²⁺",["Cu⁺","Cu²⁻","Cu⁻"],"電子を2個失うと、+が2つ多くなり Cu²⁺ になる。"],
[6,"原子が電子を受け取ると、何イオンになるか。","陰イオン",["陽イオン","中性子","分子"],"電子(−)が増えると、−の電気のほうが多くなり、陰イオンになる。"],
[6,"塩素原子が電子を1個受け取ってできるイオンはどれか。","Cl⁻",["Cl⁺","Cl²⁻","Cl"],"電子を1個受け取ると−が1つ多くなるので Cl⁻(塩化物イオン)になる。"],
[6,"電子を受け取った原子が−の電気を帯びる理由はどれか。","電子の数が陽子の数より多くなるから",["陽子の数が増えるから","中性子が減るから","原子核が壊れるから"],"陽子(+)の数は変わらず、電子(−)が増えるので、全体は−になる。"],
[7,"水酸化物イオンを表すイオン式はどれか。","OH⁻",["OH⁺","H₂O","O²⁻"],"水酸化物イオンは OH⁻。アルカリ性のもとになるイオン。"],
[7,"硫酸イオンを表すイオン式はどれか。","SO₄²⁻",["SO₄⁻","SO₃²⁻","SO₄²⁺"],"硫酸イオンは SO₄²⁻(2−の陰イオン)。"],
[7,"アンモニウムイオン(NH₄⁺)は何イオンか。","陽イオン",["陰イオン","電気を帯びない","電子"],"右上の「+」は、+の電気を帯びた陽イオンであることを表す。"],
[8,"塩化銅水溶液を電気分解したとき、陰極に付着する物質はどれか。","銅",["塩素","水素","酸素"],"Cu²⁺ が陰極で電子を受け取り、赤色の銅になって付着する。"],
[8,"塩化銅水溶液を電気分解したとき、陽極から発生する気体はどれか。","塩素",["水素","酸素","窒素"],"Cl⁻ が陽極で電子を失い、塩素(Cl₂)になって発生する。"],
[8,"塩化水素が水に溶けると、水溶液は何性を示すか。","酸性",["アルカリ性","中性","性質は変わらない"],"塩化水素は水に溶けて H⁺ と Cl⁻ に電離する。酸性のもとになるのは水素イオン(H⁺)で、塩化物イオン(Cl⁻)ではない。"],
[9,"塩酸を電気分解したとき、陰極から発生する気体はどれか。","水素",["塩素","酸素","二酸化炭素"],"H⁺ が陰極で電子を受け取り、水素(H₂)になる。"],
[9,"塩酸を電気分解したとき、陽極から発生する気体はどれか。","塩素",["水素","酸素","窒素"],"Cl⁻ が陽極で電子を失い、塩素(Cl₂)になる。"],

const KEY='ion-dojo-v1';let mem=null;

function answer(i){
 if(ST.done)return;ST.done=true;
 const q=ST.list[ST.i],c=ST.ch[i],ok=c.ok;
 const d=load();const s=d.stat[q.id]||[0,0];s[1]++;if(ok){s[0]++;delete d.wrong[q.id]}else d.wrong[q.id]=(d.wrong[q.id]||0)+1;d.stat[q.id]=s;save(d);
 if(ok)ST.score++;ST.res.push({id:q.id,ok});
 document.querySelectorAll('.ch').forEach((b,k)=>{b.disabled=true;if(ST.ch[k].ok)b.classList.add('ok');else if(k===i)b.classList.add('ng')});
 document.getElementById('sc').textContent=ST.score;document.getElementById('an').textContent=ST.res.length;
 const last=ST.i===ST.list.length-1;
 const right=ST.ch.find(x=>x.ok).t;
 document.getElementById('fb').innerHTML=`<div class="verdict ${ok?'ok':'ng'}"><span class="mk" aria-hidden="true">${ok?'○':'×'}</span><span>${ok?'正解!':'不正解'}</span></div>${ok?'':`<p class="ans">正しい答え: <b>${right}</b></p>`}<p class="exp">${q.e}</p><div class="figbox">${fig(q.n,q.id)}</div><div class="nextrow"><button class="btn pri" id="nx" data-act="next">${last?'結果を見る':'次の問題へ'}</button></div>`;
 const nx=document.getElementById('nx');if(nx){nx.scrollIntoView({block:'nearest',behavior:'smooth'});nx.focus({preventScroll:true})}
}
function next(){if(!ST.done)return;ST.i++;if(ST.i>=ST.list.length)result();else showQ()}
function result(){
 VIEW='result';const total=ST.list.length,sc=ST.score,pct=Math.round(sc/total*100);
 const d=load();d.hist.unshift({key:ST.key,title:ST.title,score:sc,total,at:Date.now()});d.hist=d.hist.slice(0,20);
 if(ST.mode==='set'){const b=d.best[ST.key];if(!b||sc/total>b.score/b.total)d.best[ST.key]={score:sc,total}}
 save(d);
 const msg=pct===100?'全問正解!完ぺきです':pct>=80?'よくできました':pct>=60?'あと一歩。ここを固めよう':'ここから伸びます。復習しよう';
 const R=52,C=2*Math.PI*R;
 const miss=ST.res.filter(r=>!r.ok).map(r=>QMAP[r.id]);
 app.innerHTML=`<section class="qcard res"><p class="unit">${ST.title}</p>
 <div class="ring"><svg viewBox="0 0 120 120" width="170" height="170" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="${R}" fill="none" stroke-width="10"/><circle class="val" id="rv" cx="60" cy="60" r="${R}" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"/></svg><div class="num"><b>${sc}</b><small>/ ${total} 問</small></div></div>
 <h2>${msg}</h2><p class="pc">正答率 ${pct}%</p>
 <div class="btns">${miss.length?`<button class="btn warn" data-act="retrymiss">間違えた${miss.length}問をもう一度</button>`:''}<button class="btn pri" data-act="again">もう一度</button><button class="btn" data-act="home">ホームへ</button></div>
 ${miss.length?`<div class="miss"><h3>間違えた問題</h3>${miss.map(q=>`<details class="mi"><summary>第${q.n}回 ${q.q}</summary><p class="a">正しい答え: <b>${q.c[0]}</b></p><p class="exp">${q.e}</p></details>`).join('')}</div>`:''}</section>`;
 toTop();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const v=document.getElementById('rv');if(v)v.style.strokeDashoffset=(C*(1-sc/total)).toFixed(1)}));
 ST.miss=miss;
}
function notes(){
 VIEW='notes';const d=load();const wr=wrongIds(d).map(id=>QMAP[id]).sort((a,b)=>a.n-b.n||(a.id>b.id?1:-1));
 let html=`<div class="qtop"><button class="ghost" data-act="home">← ホームへ</button></div><h2 style="font-size:22px;margin:4px 0 4px">復習ノート</h2><p class="empty">間違えた問題と正しい答えです。正解すると、このノートから外れます。</p>`;
 if(!wr.length)html+=`<div class="panel" style="margin-top:16px"><p class="empty">復習が必要な問題はありません。</p></div>`;
 else{html+=`<div class="btns" style="margin:14px 0"><button class="btn warn" data-act="focus">この${wr.length}問を集中して解く</button></div>`;
  let cur=0;wr.forEach(q=>{if(q.n!==cur){cur=q.n;html+=`<p class="note-u">第${q.n}回 ${UNITS[q.n]}</p>`}
   html+=`<details class="mi"><summary>${q.q}</summary><p class="a">正しい答え: <b>${q.c[0]}</b>(間違えた回数 ${d.wrong[q.id]})</p><p class="exp">${q.e}</p><div class="figbox">${fig(q.n,q.id)}</div></details>`})}
 app.innerHTML=html;toTop();
}

/* ---------- 操作 ---------- */
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.set){const s=SETS.find(x=>x.key===b.dataset.set);
  const list=s.range?QS.filter(q=>q.n>=s.range[0]&&q.n<=s.range[1]):shuffle(QS).slice(0,10);
  start(s.range?`${s.tag}(${s.title})`:s.title,s.key,list,'set');return}
 if(b.classList.contains('ch')){answer(+b.dataset.i);return}
 const a=b.dataset.act;if(!a)return;
 if(a==='go'){document.getElementById('sets').scrollIntoView({behavior:'smooth'})}
 else if(a==='home'){resetArm=false;home()}
 else if(a==='next')next();
 else if(a==='notes')notes();
 else if(a==='focus'){const d=load();const l=shuffle(wrongIds(d).map(id=>QMAP[id]));if(l.length)start('間違いを集中練習','focus',l,'focus')}
 else if(a==='retrymiss'){if(ST.miss&&ST.miss.length)start('間違いを集中練習','focus',shuffle(ST.miss),'focus')}
 else if(a==='again'){const l=ST.mode==='set'&&ST.key==='rnd'?shuffle(QS).slice(0,10):ST.mode==='focus'?shuffle(wrongIds(load()).map(id=>QMAP[id])):ST.list;
   if(l.length)start(ST.title,ST.key,l,ST.mode);else home()}
 else if(a==='reset'){if(!resetArm){resetArm=true;home()}else{resetArm=false;save({wrong:{},stat:{},hist:[],best:{}});home()}}
});
document.addEventListener('keydown',e=>{
 if(VIEW!=='quiz'||e.metaKey||e.ctrlKey||e.altKey)return;
 if(!ST.done&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(+e.key-1)}
 else if(ST.done&&e.key==='Enter'){const nx=document.getElementById('nx');if(document.activeElement!==nx){e.preventDefault();next()}}
});
home();
</script>

</body></html>
